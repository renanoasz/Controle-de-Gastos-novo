name: App Android (.apk)

# Gera o APK do app a cada atualização do site no main e publica em
# https://github.com/<dono>/<repo>/releases/download/apk/mecanica-julio.apk
on:
  push:
    branches: [main]
    paths:
      - 'mecanica-julio/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Copiar o site para dentro do app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r mecanica-julio/. android/app/src/main/assets/www/

      - name: Preparar a chave de assinatura (segredos do repositório)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/assinatura.keystore"

      - name: Gerar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/assinatura.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publicar no link fixo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk mecanica-julio.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk mecanica-julio.apk \
            --target "${{ github.sha }}" \
            --title "App Android · Mecânica Julio (versão 1.0.${{ github.run_number }})" \
            --notes "Baixe o arquivo mecanica-julio.apk no celular Android e abra para instalar. Gerado automaticamente a partir do commit ${{ github.sha }}."
